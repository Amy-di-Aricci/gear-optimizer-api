name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, unit tests, contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: openapi.json is up to date
        run: |
          npm run openapi:export
          git diff --exit-code -- openapi.json || {
            echo "::error::openapi.json is out of date. Run 'npm run openapi:export' and commit the result."
            exit 1
          }
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  database:
    name: Migrations and e2e tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials for the CI service container only.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply all migrations to an empty database
        run: npx prisma migrate deploy
      - name: Schema and migrations agree
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run test:e2e

  # main -> staging -> production (docs/environments.md). Each stage is off
  # until its repository variable is set to 'true'; production also waits for
  # the reviewers configured on the `production` environment. No secrets are
  # passed: the deploy job runs in the stage's GitHub environment and reads
  # that environment's secrets directly.
  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Amy-di-Aricci/gear-optimizer-api' && vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: [checks, database]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging

  deploy-production:
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: [deploy-staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
